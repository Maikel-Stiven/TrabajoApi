server:
  port: 9090
  servlet:
    context-path: /api/v1/tienda

spring:
  datasource:
    url: jdbc:mariadb://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:tienda_app}?createDatabaseIfNotExist=true
    username: ${DB_USER:root}
    password: ${DB_PASS:root}
    driver-class-name: org.mariadb.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

jwt:
  secret: ${JWT_SECRET:dGhpc0lzQVNlY3JldEtleUZvckpXVENyZWF0aW9uT25seUZvclRlc3Rpbmc=}
  expiration: 86400000